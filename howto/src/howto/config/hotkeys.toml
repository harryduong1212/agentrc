# howto's own keys. This file IS the keymap — there is no second copy in the
# code, so what you read here is what howto dispatches and what `?` advertises.
#
# To rebind, copy the one line you want into ~/.config/howto/hotkeys.toml:
#
#     [keys]
#     quit = ["q"]          # just q; esc no longer quits
#
# Your list REPLACES the shipped one for that action, so removing a key you did
# not want is possible. Everything you leave out keeps its default.
#
# A key is a single character, or one of these names:
#   tab enter esc space backspace up down left right
#   pgup pgdown home end shift+left shift+right shift+up shift+down
#   ctrl+<letter>  f1..f12
#
# The defaults are superfile's, so muscle memory carries between the two. The
# additions (1/2/3, r/R) are keys spf leaves unbound. ctrl+r is deliberately
# avoided: spf binds it to file_panel_item_rename.

[keys]
next_pane  = ["tab", "L"]
prev_pane  = ["shift+left", "H"]
focus_list = ["s"]
confirm    = ["enter", "right", "l"]
back       = ["h", "left", "backspace"]

view_keys = ["1"]
view_help = ["2"]
view_scan = ["3"]

down      = ["down", "j"]
up        = ["up", "k"]
page_down = ["pgdown"]
page_up   = ["pgup"]
home      = ["home"]
end       = ["end"]

search      = ["/"]
favorite    = ["P"]
refresh     = ["r"]
refresh_all = ["R"]
help        = ["?"]
quit        = ["q", "esc"]

scan_select_mode = ["v"]
scan_extend      = ["J", "K"]
scan_mark_all    = ["A"]
hotkeys_prev     = ["["]
hotkeys_next     = ["]"]

# What the always-visible bottom panel and `?` say each one does. Wording only
# — the keys come from [keys] above, so neither surface can advertise a binding
# howto does not have.
[desc]
next_pane  = "next pane"
prev_pane  = "previous pane"
focus_list = "focus the tool list"
confirm    = "into the right pane, open a node, or write a SCAN stub"
back       = "back to the list, or close a node"

view_keys = "the KEYS view"
view_help = "the HELP view"
view_scan = "the SCAN tab — what this machine has"

down      = "down"
up        = "up"
page_down = "page down"
page_up   = "page up"
home      = "first row"
end       = "last row"

search      = "search the focused pane"
favorite    = "pin or unpin this tool"
refresh     = "re-probe this tool's active view"
refresh_all = "re-probe everything"
help        = "this list"
quit        = "quit"

scan_select_mode = "select mode"
scan_extend      = "extend the marked set"
scan_mark_all    = "mark every NEW row"
hotkeys_prev     = "previous hotkey page"
hotkeys_next     = "next hotkey page"

# Compact labels keep the bottom grid readable. The expanded descriptions
# above remain the wording used by `?`.
[short]
next_pane = "next pane"
prev_pane = "previous pane"
focus_list = "tool list"
confirm = "open / write"
back = "back / close"
view_keys = "KEYS view"
view_help = "HELP view"
view_scan = "SCAN view"
down = "down"
up = "up"
page_down = "page down"
page_up = "page up"
home = "first row"
end = "last row"
search = "search"
favorite = "favourite"
refresh = "refresh tool"
refresh_all = "refresh all"
help = "expanded keys"
quit = "quit"
scan_select_mode = "select mode"
scan_extend = "extend selection"
scan_mark_all = "mark NEW"
hotkeys_prev = "previous hotkeys"
hotkeys_next = "next hotkeys"

# The actions shown in the one always-visible bottom panel. Every action is
# placed exactly once in each mode. The grid adds columns when the terminal gets
# wider and pages when they do not all fit.
[footer]
view = [
  "down", "up", "page_down", "page_up", "home", "end", "search", "favorite",
  "next_pane", "prev_pane", "focus_list", "confirm", "back", "view_keys",
  "view_help", "view_scan", "refresh", "refresh_all", "help", "quit",
  "scan_select_mode", "scan_extend", "scan_mark_all", "hotkeys_prev", "hotkeys_next",
]
scan = [
  "down", "up", "page_down", "page_up", "home", "end", "search",
  "scan_select_mode", "confirm", "scan_extend", "scan_mark_all", "back",
  "view_keys", "view_help", "view_scan", "next_pane", "prev_pane", "focus_list",
  "favorite", "refresh", "refresh_all", "help", "quit", "hotkeys_prev", "hotkeys_next",
]

# How `?` groups them, and in what order. Every action in [keys] must appear
# here exactly once — howto reports it as a config error otherwise, rather than
# quietly dispatching a key it never tells you about.
[overlay]
panes    = ["next_pane", "prev_pane", "focus_list", "confirm", "back"]
views    = ["view_keys", "view_help", "view_scan"]
moving   = ["down", "up", "page_down", "page_up", "home", "end"]
doing    = ["search", "favorite", "refresh", "refresh_all", "help", "quit", "hotkeys_prev", "hotkeys_next"]
"scan tab" = ["scan_select_mode", "scan_extend", "scan_mark_all"]
