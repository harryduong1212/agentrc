# Catppuccin Mocha, matching superfile's shipped theme of that name. curses
# exposes an indexed palette, so RGB values are mapped to the nearest xterm-256
# colour on terminals that cannot address RGB directly.
#
# Override in ~/.config/howto/theme.toml:
#
#     [colors]
#     key = "#89dceb"
#
# Values may be #RRGGBB, a 0-255 palette index, or a terminal colour name.

[colors]
background = "#1e1e2e" # full_screen_bg
text   = "#a6adc8"      # full_screen_fg
group  = "#74c7ec"      # sidebar_title
key    = "#89dceb"      # help_menu_hotkey
dim    = "#868686"      # sidebar_divider
sel    = "#98d0fd"      # file_panel_item_selected_fg
bar    = "#a6adc8"      # footer_fg
warn   = "#f38ba8"      # error
ok     = "#a6e3a1"      # correct
tab    = "#b4befe"      # file_panel_border_active
border = "#6c7086"      # footer_border
