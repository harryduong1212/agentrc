# tmux, set up for someone who has not used a multiplexer before.
# No plugin manager: everything here works the moment the file is in place.

# Ctrl-b is awkward to reach and collides with editors. Ctrl-a is the common
# alternative. "prefix" below always means Ctrl-a.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# The mouse. Click a pane to focus it, drag a border to resize, scroll to
# scroll back. This is the single setting that makes tmux usable on day one.
set -g mouse on

# Splits that say which direction they go. The defaults (% and ") do not.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Move between panes with prefix + arrow key.
bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R

# Reload this file without restarting: prefix + r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Windows and panes count from 1. Zero is on the wrong end of the keyboard.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Long scrollback — agent output is long.
set -g history-limit 50000

# Escape must not lag, or every editor feels broken inside tmux.
set -sg escape-time 10

set -g focus-events on
set -g default-terminal "tmux-256color"

# A status bar that reminds you what you are attached to, since the whole point
# is that you detach and come back.
set -g status-interval 5
set -g status-left "#[bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#{?client_prefix,PREFIX ,}%H:%M "
set -g status-position bottom
